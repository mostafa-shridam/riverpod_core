name: riverpod_core
description: "A new Flutter project."
# Private app, never published to pub.dev.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  cached_network_image: ^4.0.4
  cloud_firestore: ^7.0.0
  connectivity_plus: ^7.0.0
  device_info_plus: ^13.3.0
  dio: ^5.9.0
  easy_localization: ^3.0.8
  file_picker: ^13.1.0
  firebase_analytics: ^13.0.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_image_compress: ^2.4.0
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_native_timezone_latest: ^1.0.0
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  google_sign_in: ^7.2.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  image_cropper: ^13.0.0
  image_picker: ^1.2.1
  in_app_review: ^2.0.12
  intl: ^0.20.2
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.2
  permission_handler: ^13.0.2
  riverpod_annotation: ^4.0.1
  share_plus: ^13.3.1
  skeletonizer: ^3.0.0
  timezone: ^0.11.2
  url_launcher: ^6.3.2
  uuid: ^4.5.2
  video_player: ^2.14.1

dev_dependencies:
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  go_router_builder: ^4.5.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
flutter:
  uses-material-design: true
  assets:
    # Whole folder (not the three files) so a fresh clone without the real
    # env files still builds and tests; EnvLoader reports a missing file (D-024).
    - env/

# Launcher icons: `dart run flutter_launcher_icons` (ai-docs/HOW_TO_START_A_NEW_APP.md).
# The placeholder PNGs come from `dart run tool/generate_placeholder_icon.dart`;
# an app replaces them with its own artwork. Keep the colors in sync with
# `brandSeedColor` in lib/core/design_system/tokens/brand_config.dart.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#4A6FA5"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

# Native splash: `dart run flutter_native_splash:create`. Same color as the seed.
flutter_native_splash:
  color: "#4A6FA5"
  image: assets/images/app_icon_foreground.png
  color_dark: "#22344F"
  image_dark: assets/images/app_icon_foreground.png
  android_12:
    color: "#4A6FA5"
    image: assets/images/app_icon_foreground.png
    color_dark: "#22344F"
    image_dark: assets/images/app_icon_foreground.png
  fullscreen: false
