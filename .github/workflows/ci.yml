name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.0

jobs:
  test:
    name: Gate (format, analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Create env files from the committed examples
        run: |
          for f in env/*.env.example; do cp "$f" "${f%.example}"; done
      - name: Generate translations
        run: |
          dart run easy_localization:generate --source-dir assets/translations
          dart run easy_localization:generate -S assets/translations -f keys -o locale_keys.g.dart
      - name: build_runner
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Generated code is up to date
        # The easy_localization generators emit unformatted Dart; tracked files are formatted.
        run: |
          dart format lib/generated
          git diff --exit-code
      - name: Format
        run: dart format --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  build-android:
    name: Build Android (debug)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Create env files from the committed examples
        run: |
          for f in env/*.env.example; do cp "$f" "${f%.example}"; done
      - run: flutter build apk --debug

  build-ios:
    name: Build iOS (debug, no codesign)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Create env files from the committed examples
        run: |
          for f in env/*.env.example; do cp "$f" "${f%.example}"; done
      - run: flutter build ios --no-codesign --debug
